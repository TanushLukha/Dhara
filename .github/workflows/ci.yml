# Lint, type checks and every test on each push and pull request, on a clean Linux machine.
# Every step runs through scripts/ci_step.sh: when it fails, the end of its output becomes an
# annotation, which GitHub's public API returns without signing in (the full logs need a sign in).
# No model is called here: API keys are never stored in this public repository (decision 22).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package
        run: bash scripts/ci_step.sh "Installing the package" pip install -e ".[dev]"
      - name: Lint
        run: bash scripts/ci_step.sh "Lint" ruff check .
      - name: Types
        run: bash scripts/ci_step.sh "Type check" mypy
      - name: Tests
        run: bash scripts/ci_step.sh "Tests" pytest -q -rfE
