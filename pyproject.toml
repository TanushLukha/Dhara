[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dhara"
version = "0.1.0"
description = "Answers questions about India's criminal law Acts and cites the sections it relies on, built and measured step by step"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tanush Lukha" }]
# Dependencies arrive with the code that needs them (decision 28)
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dhara = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.mypy]
strict = true
files = ["src/dhara"]
